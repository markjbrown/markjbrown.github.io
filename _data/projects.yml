- id: cosmos-db-design-patterns
  name: Cosmos DB Design Patterns
  category: Developer learning
  featured: true
  home: false
  description: Runnable NoSQL data-modeling and architecture examples covering concurrency, partitioning, event-driven designs, and vector search.
  value: Helps developers explore coordination and failure scenarios in working code, making distributed-systems design choices easier to understand.
  role: Major contributor, expanding practical examples and improving the developer learning experience.
  sample_highlight:
    heading: "In focus: Distributed lock"
    description: An interactive playground makes lock contention, lease renewal, crash recovery, and fencing-token protection visible through competing workers backed by Cosmos DB.
  technologies: [C#, .NET, Cosmos DB, Blazor]
  repo: https://github.com/Azure-Samples/cosmos-db-design-patterns
  detail_label: Distributed lock example
  detail_url: https://github.com/Azure-Samples/cosmos-db-design-patterns/tree/main/distributed-lock
  evidence_url: https://github.com/Azure-Samples/cosmos-db-design-patterns/pull/101
  image:
    src: /assets/img/projects/distributed-lock.png
    width: 1280
    height: 1299
    alt: Distributed-lock playground shows competing workers, lock-holder and renewal controls, protected resources, fencing tokens, and an event timeline.
    caption: Distributed-lock playground with competing workers and a live event timeline.
    source_url: https://github.com/Azure-Samples/cosmos-db-design-patterns/blob/main/distributed-lock/media/distributed-lock-web.png

